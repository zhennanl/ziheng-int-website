# Pulls the inventory from Google Sheets into data/inventory.csv.
# Runs weekly (Monday), or on demand from GitHub > Actions > "Sync inventory" > Run workflow.
# A changed CSV is committed, and Cloudflare Pages redeploys the site automatically.
#
# Setup: Settings > Secrets and variables > Actions > Variables > New variable
#   Name: SHEET_CSV_URL
#   Value: the "Publish to web" CSV link of the Website tab
name: Sync inventory
on:
  schedule:
    - cron: "17 1 * * 1"   # weekly, Monday 01:17 UTC (09:17 Beijing time)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download sheet and keep only website columns
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: |
          if [ -z "$SHEET_CSV_URL" ]; then echo "SHEET_CSV_URL variable is not set; skipping."; exit 0; fi
          curl -fsSL "$SHEET_CSV_URL" -o /tmp/inventory.csv
          # Keep only the approved website columns; everything else (stock, cost...) is dropped here.
          node scripts/filter-inventory.js /tmp/inventory.csv
      - name: Check the site still builds
        run: node build.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/inventory.csv; then echo "No inventory changes."; exit 0; fi
          git config user.name "inventory-sync"
          git config user.email "inventory-sync@users.noreply.github.com"
          git add data/inventory.csv
          git commit -m "Sync inventory from Google Sheets"
          git push
